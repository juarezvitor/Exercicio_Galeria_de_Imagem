<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Galeria de Fotos</title>
  </head>
  <body>
    <header class="Header">
      <h1 class="TituloHEADER">Galeria de Imagens</h1>
      <a href=""></a>
    </header>
    <main>
      <div class="Form">
        <form id="Formdebusca">
          <button type="submit" id="ButtonBuscar">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="black"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M16.5 15c.9-1.2 1.5-2.8 1.5-4.5C18 6.4 14.6 3 10.5 3S3 6.4 3 10.5 6.4 18 10.5 18c1.7 0 3.2-.5 4.5-1.5l4.6 4.5 1.4-1.5-4.5-4.5zm-6 1c-3 0-5.5-2.5-5.5-5.5S7.5 5 10.5 5 16 7.5 16 10.5 13.5 16 10.5 16z"
              ></path>
            </svg>
          </button>
          <input
            type="text"
            name="Buscar"
            id="InputBuscar"
            placeholder="Procure por uma foto"
          />
        </form>
      </div>
      <section class="Fotocomgrid">
        <div class="GridFotos"></div>
      </section>
    </main>
    <footer class="footer">
      <p class="TextoFooter">
        © 2024 Galeria de Fotos. Todos os direitos reservados.
      </p>
    </footer>
    <script src="script2.js"></script>
  </body>
</html>
